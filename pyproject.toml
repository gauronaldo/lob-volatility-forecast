[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobvol"
version = "0.1.0"
description = "How much realized-volatility forecast accuracy survives without look-ahead"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "torch",
    "optuna",
    "shap",
    # Added to the planned stack (docs/METHOD.md section 1); see
    # docs/DEVIATIONS.md.
    "pyyaml",  # reads configs/*.yaml (dependency of optuna)
    "scipy",  # sparse design matrix, Student t (dependency of scikit-learn)
    "matplotlib",  # the five figures
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
